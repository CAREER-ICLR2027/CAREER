[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-visual-search"
version = "0.2.0"
description = "Multi-Granularity Visual Search with Verification Feedback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "numpy>=1.26,<2",
    "networkx>=3.2",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "torch>=2.7,<2.8",
]

[project.optional-dependencies]
test = ["pytest>=9", "transformers==4.57.0", "torchvision>=0.22,<0.23"]
inference = [
    "torchvision>=0.22,<0.23",
    "transformers==4.57.0",
    "accelerate>=1.0",
    "einops>=0.8",
    "timm>=1.0.17",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "pycocotools>=2.0",
    "omegaconf>=2.3",
    "iopath>=0.1.10",
    "psutil>=5.9",
    "setuptools>=68,<81",
    "peft>=0.16,<0.18",
]

[project.scripts]
career = "career.__main__:main"

[tool.setuptools.packages.find]
include = ["career*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
